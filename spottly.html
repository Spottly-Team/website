<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#6c57bc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="apple-touch-icon" href="logo.png">
    <title>Scarica l'app</title>

    <script>
        const CONFIG = {
            iosUrl: "https://apps.apple.com/us/app/spottly/id6756431227",
            androidUrl: "https://play.google.com/store/apps/details?id=com.spottlyapp.mobile&hl=it",
            logoUrl: "logo.png",
            backgroundColor: "#6c57bc",
            appScheme: "",
            redirectDelay: 400
        };
    </script>

    <style>
        :root {
            --brand: #6c57bc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--brand);
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding:
                env(safe-area-inset-top)
                env(safe-area-inset-right)
                env(safe-area-inset-bottom)
                env(safe-area-inset-left);
        }

        .logo {
            width: min(100vw, 100dvh);
            height: min(100vw, 100dvh);
            max-width: 100%;
            max-height: 100%;
            display: block;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            animation: appear 0.5s ease-out;
        }

        @keyframes appear {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <img id="logo" class="logo" src="logo.png" alt="Logo app" decoding="async">

    <script>
        (function () {
            document.documentElement.style.setProperty("--brand", CONFIG.backgroundColor);

            const themeMeta = document.querySelector('meta[name="theme-color"]');
            if (themeMeta) themeMeta.setAttribute("content", CONFIG.backgroundColor);

            const logo = document.getElementById("logo");
            logo.src = CONFIG.logoUrl;

            const ua = navigator.userAgent || navigator.vendor || window.opera || "";
            const platform = navigator.platform || "";
            const isIOS =
                /iPad|iPhone|iPod/i.test(ua) ||
                (platform === "MacIntel" && navigator.maxTouchPoints > 1);
            const isAndroid = /android/i.test(ua);

            function go(url) {
                if (CONFIG.appScheme) {
                    const start = Date.now();
                    const t = setTimeout(function () {
                        if (Date.now() - start < 2500) window.location.href = url;
                    }, 1200);
                    window.addEventListener("pagehide", function () { clearTimeout(t); });
                    window.location.href = CONFIG.appScheme;
                    return;
                }
                window.location.href = url;
            }

            if (isIOS) {
                setTimeout(function () { go(CONFIG.iosUrl); }, CONFIG.redirectDelay);
            } else if (isAndroid) {
                setTimeout(function () { go(CONFIG.androidUrl); }, CONFIG.redirectDelay);
            }
        })();
    </script>
</body>
</html>
